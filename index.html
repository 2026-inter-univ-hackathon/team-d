<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>助じゅ～る</title>
  <link href="css/beer.min.css" rel="stylesheet">
  <style>
    #detail-section {
      align-self: start;
    }

    .lead {
      color: #666;
      margin: 0 0 24px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .muted {
      color: #666;
      font-size: .9rem;
    }

    /* ---------------- toolbar ---------------- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    #current-label {
      min-width: 8em;
      text-align: center;
    }

    /* ---------------- tray ---------------- */
    #tray {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 8px;
      margin: 16px;
      border: 1px solid var(--surface-container-highest);
      border-radius: 6px;
    }

    #tray.drag-over,
    .day-cell.drag-over,
    .hour-row.drag-over {
      background-color: color-mix(in srgb, currentColor 10%, transparent);
    }

    /* ---------------- event chip ---------------- */
    .event {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: .85rem;
      cursor: grab;
      background: var(--accent);
      color: #fff;
      border: 2px solid var(--accent);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event.status-tentative {
      background: var(--surface-container-highest);
      color: var(--accent);
      border: 2px dashed var(--accent);
      opacity: .85;
    }

    .event.status-confirmed {
      background: var(--accent);
      color: #fff;
    }

    .event.status-completed {
      background: #eee;
      color: #888;
      border: 2px solid #ddd;
      text-decoration: line-through;
      opacity: .7;
    }

    /* ---------------- month view ---------------- */
    #month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-cell {
      min-height: 90px;
      border: 1px solid var(--outline);
      padding: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .day-cell.other-month {
      opacity: 0.5;
    }

    .day-cell.today>.day-num>.date {
      background: var(--primary);
      color: var(--on-primary);
    }

    .day-num {
      font-size: .8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
    }

    .day-num>.date {
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color .15s ease, color 0.2s ease;
    }

    .day-num>.date:hover {
      background-color: var(--surface-container-highest);
    }

    .day-cell.today>.day-num>.date:hover {
      background-color: var(--inverse-primary);
      color: var(--primary);
    }

    /* ---------------- timeline view ---------------- */
    #timeline-allday {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 36px;
      padding: 6px;
      border: 1px dashed var(--outline);
      border-radius: 6px;
    }

    .hour-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      border-top: 1px solid var(--outline);
      height: 64px;
      box-sizing: border-box;
    }

    .hour-label {
      width: 3.5em;
      flex-shrink: 0;
      font-size: .8rem;
      color: #666;
    }

    .hour-events {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    /* ---------------- timeline: timed events overlay ---------------- */
    .timeline-events-overlay {
      position: absolute;
      top: 0;
      left: calc(3.5em + 8px);
      right: 0;
      pointer-events: none;
    }

    .timed-event {
      position: absolute;
      box-sizing: border-box;
      pointer-events: auto;
      padding: 2px 6px;
      font-size: .78rem;
      line-height: 1.2;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .timed-event .event-time-badge {
      font-size: .68rem;
      opacity: .85;
      white-space: nowrap;
      margin-bottom: 1px;
    }

    .timed-event .event-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timed-event.short-event {
      flex-direction: row;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
      font-size: .7rem;
    }

    .timed-event.short-event .event-time-badge {
      font-size: .65rem;
      margin-bottom: 0;
    }

    .resize-handle {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7px;
      cursor: ns-resize;
      touch-action: none;
      z-index: 2;
    }

    .resize-handle-top {
      top: 0;
    }

    .resize-handle-top::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 2px;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      border-radius: 1px;
      background: rgba(255, 255, 255, .7);
      transition: background .15s ease;
    }

    .resize-handle-bottom {
      bottom: 0;
    }

    .resize-handle::after,
    .resize-handle-bottom::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 2px;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      border-radius: 1px;
      background: rgba(255, 255, 255, .7);
      transition: background .15s ease;
    }

    .resize-handle:hover::after {
      background: rgba(255, 255, 255, 1);
    }

    .event.status-tentative .resize-handle::after {
      background: currentColor;
      opacity: .6;
    }

    .event.status-tentative .resize-handle:hover::after {
      opacity: .95;
    }

    #detail-section .row {
      margin-top: 12px;
    }

    .add-button {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
    }

    #add-event-dialog {
      height: 40vh;
    }

    #detail-title {
      font-size: 1.5rem;
    }

    #detail-memo {
      height: 48px;
    }

    /* --- mobile device --- */
    @media (max-width: 768px) {
      body {
        margin: 0;
      }

      main {
        max-width: 100%;
        margin: 0;
        padding-top: 12px;
        padding-bottom: 24px;
      }

      /* カレンダー以外のコンテンツには自然な左右余白を確保 */
      h1,
      .lead,
      section:not(#calendar-section) {
        margin-left: 8px;
        margin-right: 8px;
      }

      /* カレンダーセクションは画面の左右端まで100%広げる */
      #calendar-section {
        padding: 8px 0;
        border-left: none;
        border-right: none;
        border-radius: 0;
        width: 100%;
      }

      #month-view {
        width: 100%;
      }

      #month-grid {
        gap: 1px;
        width: 100%;
      }

      .day-cell {
        border-radius: 0;
        min-height: 64px;
        padding: 2px;
        gap: 2px;
      }

      .weekday {
        font-size: .7rem;
        padding: 2px 0;
      }

      .day-num {
        font-size: .7rem;
        line-height: 1;
      }

      .day-cell .event {
        padding: 1px 3px;
        font-size: .65rem;
        line-height: 1.2;
        border-width: 1px;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <h5 class="max">助じゅ～る</h5>
      <h6 id="current-label"></h6>
      <div>
        <button class="border transparent">
          <span class="current">月表示</span>
          <i>arrow_drop_down</i>
        </button>
        <menu style="width: 176px;">
          <li id="view-month" class="active">
            <i>calendar_view_month</i>
            <span>月表示</span>
          </li>
          <li id="view-timeline">
            <i>timeline</i>
            <span>タイムライン</span>
          </li>
        </menu>
      </div>
      <nav class="group connected">
        <button id="nav-prev" class="border left-round">
          <i>arrow_back</i>
        </button>
        <button id="nav-today" class="border">
          <i>calendar_today</i>
          <span>今日</span>
        </button>
        <button id="nav-next" class="border right-round">
          <i>arrow_forward</i>
        </button>
      </nav>
    </nav>
  </header>
  <main class="responsive">
    <div class="grid">
      <section id="calendar-section" class="s12">
        <div class="toolbar">

          <div class="row">


          </div>
          <button id="notify-btn" class="secondary">🔔 通知を有効にする</button>
        </div>
        <div id="month-view">
          <div id="month-grid"></div>
        </div>
        <div id="timeline-view" hidden>
          <div id="timeline-allday"></div>
          <div id="timeline-hours"></div>
        </div>
      </section>

      <!-- ============================================================
       AI に任せない部分：予定の状態（未確定→確定／完了）は
       人がこのパネルのボタンを押すまで自動では変わりません。
       ============================================================ -->
      <section id="detail-section" class="s12 m5 l4" hidden>
        <header style="height: 24px !important">
          <nav>
            <button id="detail-close-btn" class="transparent circle absolute right">
              <i>close</i>
            </button>
          </nav>
        </header>
        <div class="field max">
          <input id="detail-title" type="text" placeholder="予定のタイトル">
        </div>
        <div class="field label border">
          <textarea id="detail-memo" rows="2"></textarea>
          <label>予定のメモ</label>
        </div>
        <div class="row">
          <div class="max field label border">
            <input id="detail-date" type="date">
            <label>日付</label>
          </div>
          <div class="max field label border">
            <input id="detail-time" type="time" step="900">
            <label>開始時刻</label>
          </div>
        </div>
        <p class="muted">開始時刻は15分単位で設定できます。タイムライン表示では予定ブロックの下端をドラッグして所要時間を変更できます。</p>
        <div class="field middle-align">
          <nav>
            <div class="max">
              <h6>ステータス</h6>
              <div>予定のステータスを人が決定する。</div>
            </div>
            <div>
              <button class="round transparent border">
                <span class="current-status">未確定</span>
                <i>arrow_drop_down</i>
              </button>
              <menu>
                <li id="status-tentative">未確定</li>
                <li id="status-confirmed">確定</li>
                <li id="status-completed">完了</li>
              </menu>
            </div>
          </nav>
        </div>
        <div class="row">
          <button id="detail-save">保存</button>
          <button id="detail-clear-date" class="secondary">日時をクリア（トレイへ戻す）</button>
          <button id="detail-delete" class="danger">削除</button>
        </div>
      </section>
    </div>
  </main>
  <button class="l m round large add-button" data-ui="#add-event-dialog">
    <i>add</i>
    <span>予定の追加</span>
  </button>
  <button class="s square round large add-button" data-ui="#add-event-dialog">
    <i>add</i>
  </button>
  <dialog class="bottom" id="add-event-dialog">
    <nav>
      <h5 class="max">予定の追加</h5>
      <button class="transparent circle" data-ui="#add-event-dialog">
        <i>close</i>
      </button>
    </nav>
    <div class="field label border">
      <input type="text" id="new-title">
      <label>予定のタイトル</label>
    </div>
    <div id="tray"></div>
    <nav class="right-align">
      <button id="add-event">追加</button>
    </nav>
  </dialog>
  <script src="js/material-dynamic-colors.min.js"></script>
  <script src="js/beer.min.js"></script>

  <script>
    // ============================================================
    // データの保存と読み込み（localStorage）
    // ============================================================
    const STORAGE_KEY = 'tentative_calendar_events';
    const REMINDER_DAYS = 3; // 仕様書に具体的な日数指定がないため仮の既定値
    const HOUR_H = 64; // タイムラインの1時間あたりの高さ(px)。CSSの .hour-row の height と合わせる

    function loadEvents() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveEvents(events) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function uid() {
      return 'ev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function dateStr(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function todayStr() {
      return dateStr(new Date());
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function timeToHours(timeStr) {
      if (!timeStr) return 0;
      const parts = timeStr.split(':');
      const h = parseInt(parts[0], 10) || 0;
      const m = parseInt(parts[1], 10) || 0;
      return h + m / 60;
    }

    function hoursToTime(hours) {
      let totalMin = Math.round(hours * 60);
      totalMin = Math.round(totalMin / 15) * 15;
      let h = Math.floor(totalMin / 60);
      let m = totalMin % 60;
      if (h >= 24) {
        h = 23;
        m = 45;
      }
      return `${pad2(h)}:${pad2(m)}`;
    }

    function calcEndTime(startTimeStr, durationHours) {
      if (!startTimeStr) return '';
      const start = timeToHours(startTimeStr);
      const end = Math.min(24, start + (durationHours || 1));
      let totalMin = Math.round(end * 60);
      totalMin = Math.round(totalMin / 15) * 15;
      const endH = Math.floor(totalMin / 60);
      const endM = totalMin % 60;
      return `${pad2(endH)}:${pad2(endM)}`;
    }

    // ============================================================
    // 状態
    // ============================================================
    let view = 'month';       // 'month' | 'timeline'
    let viewDate = new Date(); // 月表示: この月を表示 / タイムライン: この日を表示
    let selectedEventId = null;

    const trayEl = document.getElementById('tray');
    const monthViewEl = document.getElementById('month-view');
    const timelineViewEl = document.getElementById('timeline-view');
    const monthGridEl = document.getElementById('month-grid');
    const timelineAlldayEl = document.getElementById('timeline-allday');
    const timelineHoursEl = document.getElementById('timeline-hours');
    const currentLabelEl = document.getElementById('current-label');
    const detailSection = document.getElementById('detail-section');
    let wasDialogOpenOnDrag = false;

    // ============================================================
    // 予定チップの生成（ドラッグ元・クリックで詳細表示）
    // ============================================================
    function createEventChip(ev) {
      const chip = document.createElement('div');
      chip.className = `event status-${ev.status.toLowerCase()}`;
      chip.textContent = `${ev.title || '(無題)'}`;
      chip.draggable = true;
      chip.dataset.id = ev.id;
      chip.title = ev.memo || ev.title;
      chip.addEventListener('dragstart', (e) => {
        const isFromTray = chip.closest('#tray') !== null || !ev.date;
        if (isFromTray) {
          wasDialogOpenOnDrag = true;
          setTimeout(() => {
            ui("#add-event-dialog");
          }, 0);
        }
        e.dataTransfer.setData('text/plain', ev.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      chip.addEventListener('dragend', () => {
        if (wasDialogOpenOnDrag) {
          wasDialogOpenOnDrag = false;
          setTimeout(() => {
            ui("#add-event-dialog");
          }, 0);
        }
      });
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        openDetail(ev.id);
      });
      return chip;
    }

    function addDropHandlers(el, onDrop) {
      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        el.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        if (id) onDrop(id, e);
        if (wasDialogOpenOnDrag) {
          wasDialogOpenOnDrag = false;
          setTimeout(() => {
            ui("#add-event-dialog");
          }, 0);
        }
      });
    }
    //
    // ============================================================
    // 描画：未確定トレイ（日時未定の予定）
    // ============================================================
    function renderTray() {
      const events = loadEvents();
      trayEl.innerHTML = '';
      const untimed = events.filter(ev => !ev.date);
      if (untimed.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'muted';
        empty.innerHTML = '<span style="margin-top: auto; margin-bottom: auto;">トレイは空です</span>';
        trayEl.appendChild(empty);
      }
      untimed.forEach(ev => trayEl.appendChild(createEventChip(ev)));
    }

    addDropHandlers(trayEl, (id) => {
      const events = loadEvents();
      const ev = events.find(e => e.id === id);
      if (!ev) return;
      ev.date = null;
      ev.time = null;
      saveEvents(events);
      renderAll();
    });

    // ============================================================
    // 描画：月表示
    // ============================================================
    function renderMonth() {
      monthGridEl.innerHTML = '';
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      currentLabelEl.textContent = `${year}年${month + 1}月`;

      ['日', '月', '火', '水', '木', '金', '土'].forEach(w => {
        const el = document.createElement('div');
        el.textContent = w;
        monthGridEl.appendChild(el);
      });

      const firstOfMonth = new Date(year, month, 1);
      const startOffset = firstOfMonth.getDay();
      const gridStart = new Date(year, month, 1 - startOffset);
      const events = loadEvents();
      const today = todayStr();

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cellCount = (startOffset + daysInMonth) > 35 ? 42 : 35;

      for (let i = 0; i < cellCount; i++) {
        const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
        const cellStr = dateStr(cellDate);
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (cellDate.getMonth() !== month) cell.classList.add('other-month');
        if (cellStr === today) cell.classList.add('today');

        const num = document.createElement('div');
        num.className = 'day-num';
        num.innerHTML = `<span class="center date">${cellDate.getDate()}</span>`;
        cell.appendChild(num);

        events.filter(ev => ev.date === cellStr).forEach(ev => cell.appendChild(createEventChip(ev)));

        cell.addEventListener('click', (e) => {
          if (e.target.closest('.event')) return;
          viewDate = new Date(cellDate);
          setView('timeline');
        });

        addDropHandlers(cell, (id) => {
          const evs = loadEvents();
          const ev = evs.find(e => e.id === id);
          if (!ev) return;
          ev.date = cellStr; // 月表示では時刻は付けない
          saveEvents(evs);
          renderAll();
        });

        monthGridEl.appendChild(cell);
      }
    }

    // ============================================================
    // 描画：日別タイムライン（0〜23時）
    // ============================================================
    function renderTimeline() {
      const dayStr = dateStr(viewDate);
      const weekdayNames = ['日', '月', '火', '水', '木', '金', '土'];
      let labelText = `${viewDate.getFullYear()}年${viewDate.getMonth() + 1}月${viewDate.getDate()}日(${weekdayNames[viewDate.getDay()]})`;
      currentLabelEl.textContent = labelText;

      const events = loadEvents().filter(ev => ev.date === dayStr);

      timelineAlldayEl.innerHTML = '';
      const untimed = events.filter(ev => !ev.time);
      if (untimed.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'muted';
        hint.textContent = '時刻未定（この日に予定あり）';
        timelineAlldayEl.appendChild(hint);
      }
      untimed.forEach(ev => timelineAlldayEl.appendChild(createEventChip(ev)));
      addDropHandlers(timelineAlldayEl, (id) => {
        const evs = loadEvents();
        const ev = evs.find(e => e.id === id);
        if (!ev) return;
        ev.date = dayStr;
        ev.time = null;
        saveEvents(evs);
        renderAll();
      });

      timelineHoursEl.innerHTML = '';
      timelineHoursEl.style.position = 'relative';
      for (let h = 0; h < 24; h++) {
        const row = document.createElement('div');
        row.className = 'hour-row';

        const label = document.createElement('div');
        label.className = 'hour-label';
        label.textContent = `${pad2(h)}:00`;
        row.appendChild(label);

        const slot = document.createElement('div');
        slot.className = 'hour-events';
        row.appendChild(slot);

        addDropHandlers(row, (id, e) => {
          const evs = loadEvents();
          const ev = evs.find(e => e.id === id);
          if (!ev) return;
          ev.date = dayStr;
          let m = 0;
          if (e && e.clientY) {
            const offsetY = e.clientY - row.getBoundingClientRect().top;
            const q = Math.min(3, Math.max(0, Math.floor(offsetY / (HOUR_H / 4))));
            m = q * 15;
          }
          ev.time = `${pad2(h)}:${pad2(m)}`;
          saveEvents(evs);
          renderAll();
        });

        timelineHoursEl.appendChild(row);
      }

      // 時刻ありの予定を、時間帯が重ならないよう横のレーンに振り分けて重ねて配置する
      const timed = events
        .filter(ev => ev.time)
        .map(ev => ({ ev, start: timeToHours(ev.time), duration: ev.duration || 1 }));
      const { laneOf, laneCount } = assignLanes(timed);

      const overlay = document.createElement('div');
      overlay.className = 'timeline-events-overlay';
      overlay.style.height = (24 * HOUR_H) + 'px';
      timed.forEach(({ ev, start, duration }) => {
        const lane = laneOf[ev.id];
        const widthPct = 100 / laneCount;
        const chip = createTimedEventChip(ev, {
          top: (start * HOUR_H) + 'px',
          height: Math.max(14, (duration * HOUR_H - 2)) + 'px',
          left: `calc(${lane * widthPct}%)`,
          width: `calc(${widthPct}% - 4px)`,
        });
        overlay.appendChild(chip);
      });
      // 予定チップは hour-row の子要素ではないため、チップの上にドロップされた分は
      // hour-row 側のドロップ処理まで届かない。オーバーレイ自身にも同じ処理を付けて拾う
      overlay.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });
      overlay.addEventListener('drop', (e) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        if (!id) return;
        const y = e.clientY - timelineHoursEl.getBoundingClientRect().top;
        const totalQuarters = Math.min(24 * 4 - 1, Math.max(0, Math.floor(y / (HOUR_H / 4))));
        const hour = Math.floor(totalQuarters / 4);
        const minute = (totalQuarters % 4) * 15;
        const evs = loadEvents();
        const ev = evs.find(e2 => e2.id === id);
        if (!ev) return;
        ev.date = dayStr;
        ev.time = `${pad2(hour)}:${pad2(minute)}`;
        saveEvents(evs);
        renderAll();
        if (wasDialogOpenOnDrag) {
          wasDialogOpenOnDrag = false;
          setTimeout(() => {
            ui("#add-event-dialog");
          }, 0);
        }
      });
      timelineHoursEl.appendChild(overlay);
    }

    // 重ならないよう予定を横のレーンに割り当てる（時間帯が重なるものだけレーンを分ける）
    function assignLanes(timedEvents) {
      const sorted = [...timedEvents].sort((a, b) => a.start - b.start);
      const laneEnds = []; // 各レーンで最後に置いた予定の終了時刻
      const laneOf = {};
      sorted.forEach(({ ev, start, duration }) => {
        const end = start + duration;
        let lane = laneEnds.findIndex(endTime => endTime <= start);
        if (lane === -1) {
          lane = laneEnds.length;
          laneEnds.push(end);
        } else {
          laneEnds[lane] = end;
        }
        laneOf[ev.id] = lane;
      });
      return { laneOf, laneCount: Math.max(1, laneEnds.length) };
    }

    // タイムライン用の予定チップ（位置指定＋上下端の時間調整ハンドル付き）
    function createTimedEventChip(ev, style) {
      const chip = createEventChip(ev);
      chip.classList.add('timed-event');
      const dur = ev.duration || 1;
      if (dur <= 0.25) {
        chip.classList.add('short-event');
      }
      const endTime = calcEndTime(ev.time, dur);
      chip.innerHTML = `
        <span class="event-time-badge">${ev.time} - ${endTime}</span>
        <span class="event-title-text">${escapeHtml(ev.title || '(無題)')}</span>
      `;
      Object.assign(chip.style, style);

      const topHandle = document.createElement('div');
      topHandle.className = 'resize-handle resize-handle-top';
      topHandle.title = 'ドラッグして開始時刻を変更（15分刻み）';
      topHandle.addEventListener('dragstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
      topHandle.addEventListener('pointerdown', (e) => startResizeTop(e, ev.id, chip));
      chip.appendChild(topHandle);

      const bottomHandle = document.createElement('div');
      bottomHandle.className = 'resize-handle resize-handle-bottom';
      bottomHandle.title = 'ドラッグして所要時間を変更（15分刻み）';
      bottomHandle.addEventListener('dragstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
      bottomHandle.addEventListener('pointerdown', (e) => startResize(e, ev.id, chip));
      chip.appendChild(bottomHandle);
      return chip;
    }

    // 予定ブロックの上端をドラッグして開始時刻および所要時間（時間単位）を変更する
    function startResizeTop(e, id, chipEl) {
      e.preventDefault();
      e.stopPropagation();
      const events = loadEvents();
      const ev = events.find(x => x.id === id);
      if (!ev || !ev.time) return;

      const startY = e.clientY;
      const initDuration = ev.duration || 1;
      const initStartHours = timeToHours(ev.time);
      const endHours = initStartHours + initDuration;
      const minStartHours = 0;
      const maxStartHours = Math.max(0, endHours - 0.25);
      let finalStartHours = initStartHours;
      let finalDuration = initDuration;
      let finalTimeStr = ev.time;

      const timeBadge = chipEl.querySelector('.event-time-badge');

      function onMove(moveEvent) {
        const deltaQuarters = Math.round((moveEvent.clientY - startY) / (HOUR_H / 4));
        const rawStartHours = initStartHours + deltaQuarters * 0.25;
        finalStartHours = Math.max(minStartHours, Math.min(maxStartHours, Math.round(rawStartHours * 4) / 4));
        finalDuration = Math.round((endHours - finalStartHours) * 4) / 4;
        finalTimeStr = hoursToTime(finalStartHours);

        chipEl.style.top = (finalStartHours * HOUR_H) + 'px';
        chipEl.style.height = Math.max(14, (finalDuration * HOUR_H - 2)) + 'px';
        if (finalDuration <= 0.25) {
          chipEl.classList.add('short-event');
        } else {
          chipEl.classList.remove('short-event');
        }
        if (timeBadge) {
          timeBadge.textContent = `${finalTimeStr} - ${calcEndTime(finalTimeStr, finalDuration)}`;
        }
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if (finalStartHours !== initStartHours || finalDuration !== initDuration) {
          ev.time = finalTimeStr;
          ev.duration = finalDuration;
          saveEvents(events);
        }
        renderAll();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    }

    // 予定ブロックの下端をドラッグして所要時間（時間単位）を変更する
    function startResize(e, id, chipEl) {
      e.preventDefault();
      e.stopPropagation();
      const events = loadEvents();
      const ev = events.find(x => x.id === id);
      if (!ev || !ev.time) return;

      const startY = e.clientY;
      const startDuration = ev.duration || 1;
      const startHours = timeToHours(ev.time);
      const maxDuration = Math.max(0.25, 24 - startHours);
      let finalDuration = startDuration;

      const timeBadge = chipEl.querySelector('.event-time-badge');

      function onMove(moveEvent) {
        const deltaQuarters = Math.round((moveEvent.clientY - startY) / (HOUR_H / 4));
        const rawDuration = startDuration + deltaQuarters * 0.25;
        finalDuration = Math.min(maxDuration, Math.max(0.25, Math.round(rawDuration * 4) / 4));
        chipEl.style.height = Math.max(14, (finalDuration * HOUR_H - 2)) + 'px';
        if (finalDuration <= 0.25) {
          chipEl.classList.add('short-event');
        } else {
          chipEl.classList.remove('short-event');
        }
        if (timeBadge) {
          timeBadge.textContent = `${ev.time} - ${calcEndTime(ev.time, finalDuration)}`;
        }
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if (finalDuration !== startDuration) {
          ev.duration = finalDuration;
          saveEvents(events);
        }
        renderAll();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    }

    // ============================================================
    // ビュー切り替え・日付移動
    // ============================================================
    function setView(next) {
      view = next;
      document.querySelector(".current").textContent = view === 'month' ? '月表示' : 'タイムライン';
      document.getElementById('view-month').className = view === 'month' ? 'active' : '';
      document.getElementById('view-timeline').className = view === 'timeline' ? 'active' : '';
      monthViewEl.hidden = view !== 'month';
      timelineViewEl.hidden = view !== 'timeline';
      renderAll();
    }

    document.getElementById('view-month').addEventListener('click', () => setView('month'));
    document.getElementById('view-timeline').addEventListener('click', () => setView('timeline'));

    document.getElementById('nav-prev').addEventListener('click', () => {
      if (view === 'month') viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
      else viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() - 1);
      renderAll();
    });
    document.getElementById('nav-next').addEventListener('click', () => {
      if (view === 'month') viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
      else viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() + 1);
      renderAll();
    });
    document.getElementById('nav-today').addEventListener('click', () => {
      viewDate = new Date();
      renderAll();
    });

    // ============================================================
    // 予定の追加（常にトレイへ：日時はドラッグで割り当てる）
    // ============================================================
    document.getElementById('add-event').addEventListener('click', () => {
      const input = document.getElementById('new-title');
      const title = input.value.trim();
      if (!title) return;
      const events = loadEvents();
      events.push({
        id: uid(),
        title,
        memo: '',
        status: 'TENTATIVE',
        date: null,
        time: null,
        duration: 1,
        createdAt: Date.now(),
        remindedOn: null,
      });
      saveEvents(events);
      input.value = '';
      renderAll();
    });
    document.getElementById('new-title').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('add-event').click();
    });

    // ============================================================
    // 予定の詳細パネル（人がステータスを確定する場所）
    // ============================================================
    function openDetail(id) {
      if (!detailSection.hidden && selectedEventId === id) {
        closeDetail();
        return;
      }
      window.location.hash = `#${id}`;
      selectedEventId = id;
      pendingStatus = null;
      const ev = loadEvents().find(e => e.id === id);
      if (!ev) return;
      document.getElementById('detail-title').value = ev.title || '';
      document.getElementById('detail-memo').value = ev.memo || '';
      document.getElementById('detail-date').value = ev.date || '';
      document.getElementById('detail-time').value = ev.time || '';
      highlightStatus(ev.status);
      const calendarSection = document.getElementById('calendar-section');
      calendarSection.className = 's12 m7 l8';
      detailSection.className = 's12 m5 l4';
      detailSection.hidden = false;
      adjustHeight(document.getElementById('detail-memo'));
    }

    function highlightStatus(status) {
      const statusEl = document.querySelector(".current-status");
      if (status === 'TENTATIVE') {
        statusEl.textContent = '未確定';
      } else if (status === 'CONFIRMED') {
        statusEl.textContent = '確定';
      } else if (status === 'COMPLETED') {
        statusEl.textContent = '完了';
      }
      ['tentative', 'confirmed', 'completed'].forEach(s => {
        document.getElementById(`status-${s}`).className = s.toUpperCase() === status ? 'active' : '';
      });
    }

    let pendingStatus = null;
    ['tentative', 'confirmed', 'completed'].forEach(s => {
      document.getElementById(`status-${s}`).addEventListener('click', () => {
        pendingStatus = s.toUpperCase();
        highlightStatus(pendingStatus);
      });
    });

    function adjustHeight(target) {
      const heightLimit = 20;
      target.style.height = 'auto';
      target.style.height = Math.min(target.scrollHeight, heightLimit * 48) + 'px';
    }
    document.getElementById('detail-memo').addEventListener('input', (e) => {
      adjustHeight(e.target);
    })

    document.getElementById('detail-save').addEventListener('click', () => {
      if (!selectedEventId) return;
      const events = loadEvents();
      const ev = events.find(e => e.id === selectedEventId);
      if (!ev) return;
      ev.title = document.getElementById('detail-title').value.trim() || ev.title;
      ev.memo = document.getElementById('detail-memo').value;

      const dateVal = document.getElementById('detail-date').value;
      const timeVal = document.getElementById('detail-time').value;

      if (dateVal) {
        ev.date = dateVal;
        if (timeVal) {
          const [h, m] = timeVal.split(':').map(Number);
          const snappedM = Math.round((m || 0) / 15) * 15;
          if (snappedM >= 60) {
            ev.time = `${pad2((h + 1) % 24)}:00`;
          } else {
            ev.time = `${pad2(h)}:${pad2(snappedM)}`;
          }
        } else {
          ev.time = null;
        }
      } else if (timeVal) {
        ev.date = dateStr(viewDate);
        const [h, m] = timeVal.split(':').map(Number);
        const snappedM = Math.round((m || 0) / 15) * 15;
        if (snappedM >= 60) {
          ev.time = `${pad2((h + 1) % 24)}:00`;
        } else {
          ev.time = `${pad2(h)}:${pad2(snappedM)}`;
        }
      } else {
        ev.date = null;
        ev.time = null;
      }

      if (pendingStatus) ev.status = pendingStatus;
      pendingStatus = null;
      saveEvents(events);
      closeDetail();
      renderAll();
    });

    document.getElementById('detail-clear-date').addEventListener('click', () => {
      if (!selectedEventId) return;
      const events = loadEvents();
      const ev = events.find(e => e.id === selectedEventId);
      if (!ev) return;
      ev.date = null;
      ev.time = null;
      saveEvents(events);
      closeDetail();
      renderAll();
    });

    document.getElementById('detail-delete').addEventListener('click', () => {
      if (!selectedEventId) return;
      const events = loadEvents().filter(e => e.id !== selectedEventId);
      saveEvents(events);
      closeDetail();
      renderAll();
    });
    document.getElementById('detail-close-btn').addEventListener('click', closeDetail);

    function closeDetail() {
      window.location.hash = '';
      selectedEventId = null;
      pendingStatus = null;
      detailSection.hidden = true;
      const calendarSection = document.getElementById('calendar-section');
      calendarSection.className = 's12';
    }

    // ============================================================
    // ローカル通知（未確定のまま指定日数経過した予定を知らせる）
    // 人が明示的に許可ボタンを押すまで通知は送らない
    // ============================================================
    const notifyBtn = document.getElementById('notify-btn');

    function updateNotifyBtn() {
      if (!('Notification' in window)) {
        notifyBtn.textContent = '🔕 このブラウザは通知非対応';
        notifyBtn.disabled = true;
        return;
      }
      notifyBtn.textContent = Notification.permission === 'granted'
        ? '🔔 通知は有効です'
        : '🔔 通知を有効にする';
    }

    notifyBtn.addEventListener('click', () => {
      if (!('Notification' in window)) return;
      Notification.requestPermission().then(() => {
        updateNotifyBtn();
        checkReminders();
      });
    });

    function checkReminders() {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const events = loadEvents();
      const now = Date.now();
      const dueMs = REMINDER_DAYS * 24 * 60 * 60 * 1000;
      const today = todayStr();
      let changed = false;
      events.forEach(ev => {
        if (ev.status !== 'TENTATIVE') return;
        if (now - ev.createdAt < dueMs) return;
        if (ev.remindedOn === today) return;
        try {
          new Notification('未確定の予定があります', { body: ev.title });
        } catch { /* 通知生成に失敗しても処理は続行する */ }
        ev.remindedOn = today;
        changed = true;
      });
      if (changed) saveEvents(events);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkReminders();
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (window.location.hash) {
        setTimeout(() => {
          openDetail(window.location.hash.split("#")[1]);
        }, 300);
      }
    })

    // ============================================================
    // 全体描画
    // ============================================================
    function renderAll() {
      renderTray();
      if (view === 'month') renderMonth();
      else renderTimeline();
    }

    updateNotifyBtn();
    renderAll();
    checkReminders();
  </script>
</body>

</html>
