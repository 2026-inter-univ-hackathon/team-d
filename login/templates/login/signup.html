<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規登録 | 助じゅ～る</title>
  <link href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>

<body>
  <div id="auth-error" class="snackbar error top" role="alert" aria-live="assertive"></div>
  <div id="auth-info" class="snackbar top" role="status" aria-live="polite"></div>

  <main class="auth-card">
    <article class="round medium-elevate border" style="padding: 28px 24px;">
      <header class="center-align" style="margin-bottom: 20px;">
        <h4 style="margin: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
          <i class="extra" style="color: var(--primary);">calendar_month</i>
          <span>助じゅ～る</span>
        </h4>
        <p class="small-text" style="color: var(--on-surface-variant); margin: 6px 0 0;">自分の予定を、決まったところから。</p>
      </header>

      <nav class="tabs center-align" aria-label="アカウント" style="margin-bottom: 24px;">
        <a href="/login/">
          <i>login</i>
          <span>ログイン</span>
        </a>
        <a href="/signup/" class="active">
          <i>person_add</i>
          <span>新規登録</span>
        </a>
      </nav>

      <form id="auth-form" data-mode="signup" data-success-url="/">
        <div class="field label border round prefix" style="margin-bottom: 16px;">
          <i>mail</i>
          <input id="id_email" name="email" type="email" maxlength="254" required autocomplete="email"
            autocapitalize="none" spellcheck="false" placeholder=" ">
          <label for="id_email">メールアドレス</label>
        </div>

        <div class="field label border round prefix" style="margin-bottom: 6px;">
          <i>person</i>
          <input id="id_username" name="username" type="text" maxlength="32" required autocomplete="username"
            aria-describedby="username-hint" placeholder=" ">
          <label for="id_username">ユーザー名</label>
        </div>
        <p class="small-text" id="username-hint"
          style="color: var(--on-surface-variant); margin: 0 0 16px 12px; font-size: 0.8rem;">
          画面に表示する名前を1〜32文字で入力してください。
        </p>

        <div class="field label border round prefix" style="margin-bottom: 6px;">
          <i>lock</i>
          <input id="id_password1" name="password1" type="password" minlength="6" required autocomplete="new-password"
            aria-describedby="password-hint" placeholder=" ">
          <label for="id_password1">パスワード</label>
        </div>
        <p class="small-text" id="password-hint"
          style="color: var(--on-surface-variant); margin: 0 0 16px 12px; font-size: 0.8rem;">
          6文字以上で入力してください。
        </p>

        <div class="field label border round prefix" style="margin-bottom: 20px;">
          <i>lock_reset</i>
          <input id="id_password2" name="password2" type="password" minlength="6" required autocomplete="new-password"
            placeholder=" ">
          <label for="id_password2">パスワード（確認）</label>
        </div>

        <button type="submit" class="primary round max" style="margin-bottom: 12px; height: 44px;">
          <i>person_add</i>
          <span>新規登録</span>
        </button>

        <p class="small-text center-align"
          style="color: var(--on-surface-variant); margin: 8px 0 0; font-size: 0.8rem; line-height: 1.4;">
          登録後に確認メールを送信します。メール内のリンクを開いてからログインしてください。
        </p>
      </form>
    </article>
  </main>

  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="/static/firebase-config.js"></script>
  <script src="/static/firebase-app.js"></script>
  <script src="/static/login/firebase-auth.js"></script>
  <script src="/static/firebase-events.js"></script>
  <script src="/static/login/api.js"></script>
  <script src="/static/login/auth.js"></script>
</body>

</html>
